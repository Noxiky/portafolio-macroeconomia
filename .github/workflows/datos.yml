name: Actualizar datos INE/BCB

on:
  schedule:
    - cron: "30 12 * * *"   # 08:30 Bolivia (UTC-4), todos los días
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Descargar datos del BCB
        run: python scripts/actualizar_datos.py
      - name: Publicar cambios
        run: |
          git config user.name "portafolio-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/macro.json
          git diff --cached --quiet && echo "sin cambios" || git commit -m "datos: $(date -u +%F)" && git push
